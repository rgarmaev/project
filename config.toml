[trading]
symbol = "SOL"
quote  = "USDT"

# Minimum net spread (after fees) to trigger a trade: 0.001 = 0.1%
min_spread_pct   = "0.001"

# USDT notional per leg
trade_size_usdt  = "200"

# Maximum allowed slippage vs quoted price
max_slippage_pct = "0.0005"

# Set to false to execute real orders
paper_trading = true

# ── Avellaneda-Stoikov 2008 ──────────────────────────────────────────────────
# Risk aversion (calibrated for fractional prices, not fixed-point)
gamma = 50.0
# Fill-intensity parameter: lambda(d) = A * exp(-k*d)
k     = 1.5
# Rolling time-horizon constant
tau   = 1.0
# Reject signal if order-book imbalance exceeds this magnitude
imbalance_threshold = 0.8

[risk]
max_position_usdt  = "2000"
max_daily_loss_usdt = "100"
max_open_trades    = 3
cooldown_ms        = 500   # minimum ms between consecutive signals

[binance]
api_key    = ""   # override with BINANCE_API_KEY env var
api_secret = ""
testnet    = false   # use real prices for paper trading simulation

[bybit]
api_key    = ""   # override with BYBIT_API_KEY env var
api_secret = ""
testnet    = false   # testnet had fake prices (SOL Perp $242 vs Spot $83)

[mexc]
api_key    = ""   # override with MEXC_API_KEY env var
api_secret = ""
testnet    = false
